<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
</head>

<style>
    body{
        background-color: black;
        color: rgb(0, 0, 0);
    }
    .main{
        border: 1px solid wheat;
        width: 300px;
        padding: 20px;
        margin: 70px auto;
        background: linear-gradient(skyblue,pink);
        background-repeat: no-repeat;
        background-attachment: fixed;
        border-radius: 10px;
    }
    input ,ul,li{
        margin-left: 50px;
    }
    h1{
        text-align: center;
    }
    button{  
        border-radius: 5px;
        border: transparent ;
        background-color: green;
    }
    ol li button{
        border-radius: 5px;
        border: transparent ;
        background-color: red;

    }
    input{
        outline: none;
    }

</style>
<body>

    <div class="main">
        <h1>DO-TO LIST</h1>
        <input type="text"  id="list" autocomplete="off">
        <button onclick="add()">ADD</button>
       <ol id="listitem">
        <li> barath
            <button onclick="Delete(event)">Delete</button>
        </li>
     </ol>

    </div>
    <script>
    var input=document.getElementById('list');
    var ul=document.getElementById('listitem')
    function add (){
        var listview=document.createElement('li')
        listview.innerHTML=input.value + "<button onclick='Delete(event)'>Delete</button>"
        ul.append(listview);
    }
    function Delete(event) {
        event.target.parentElement.remove()
        
    }
    </script>
</body>
</html>
